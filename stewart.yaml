# Only what differs from the defaults: `make config-reference` lists every setting, `make config` shows what is in
# effect. Secrets (the Home Assistant token, the control token) belong in .env, never here.
log_level: debug

apps:
  timed-light:
    options:
      configuration:
        - name: 'pantry-cabinet-1'
          entrySensors: ['binary_sensor.myggbett_door_window_sensor_10_door']
          motionSensors: []
          lightEntityId: 'light.led_controller_pantry_channel_2'
          coverEntityId: ''
          timeoutSeconds: 60
  notification-mqtt-bridge:
    options:
      topic: 'stewart/notify'
      actionTopic: 'stewart/notify/action'
  day-night-mode:
    enabled: false
    options:
      day:
        defaultStrategy: sun_above_horizon
        strategies:
          - {name: sun_above_horizon, type: sun, event: sunrise}
          - {name: covers_opened, type: state, entity: binary_sensor.covers_opened_kitchen_and_living_room, state: 'on'}
          - {name: fixed_time, type: fixed_time, time: '07:30'}
          - name: light_level
            type: above
            entity: sensor.outdoor_illuminance_lux_average
            threshold: 30
            min: 10
            max: 200
            step: 10
            unit: lx
            forSeconds: 300
      night:
        defaultStrategy: covers_closed
        strategies:
          - {name: covers_closed, type: state, entity: binary_sensor.covers_closed_all, state: 'on'}
          - {name: sun_below_horizon, type: sun, event: sunset}
          - {name: fixed_time, type: fixed_time, time: '20:30'}
          - name: light_level
            type: below
            entity: sensor.outdoor_illuminance_lux_average
            threshold: 20
            min: 10
            max: 200
            step: 10
            unit: lx
            forSeconds: 300
  sleep-mode:
    enabled: false
    options:
      activation:
        window: {from: '18:00', until: '03:00'}
        defaultStrategy: bed_presence_double
        strategies:
          - name: room_presence
            type: state
            entity: binary_sensor.athom_presence_1_f9a3ab_occupancy
            forSeconds: 1800
          - name: bed_presence_single
            type: state
            entity: binary_sensor.master_bed_partially_occupied
            forSeconds: 1800
          - name: bed_presence_double
            type: state
            entity: binary_sensor.master_bed_fully_occupied
            forSeconds: 1800
        alwaysActive:
          - {name: forced_activation, type: fixed_time, time: '02:00'}
      deactivation:
        window: {from: '04:00', until: '12:00'}
        defaultStrategy: bed_presence
        strategies:
          - name: bed_presence
            type: state
            entity: binary_sensor.master_bed_partially_occupied
            state: 'off'
            forSeconds: 600
          - {name: covers_opened, type: state, entity: cover.cover_group_master_bedroom, state: open, forSeconds: 120}
  home-alert:
    options:
      policies:
        critical:
          steps:
            - destinations: [{type: notify_service, target: notify.mobile_app_zoli_phone}]
            - afterSeconds: 120
              destinations: [{type: tts, target: media_player.home}]
              repeat: {everySeconds: 300}
        smoke-leak:
          steps:
            - destinations: [{type: notify_service, target: notify.mobile_app_zoli_phone}]
            - destinations:
                - type: phone_tts
                  target: notify.mobile_app_zoli_phone
                  conditions: [{type: eq, field: input_boolean.alarm_theater_mode, value: 'off'}]
              repeat: {everySeconds: 30, times: 5, while: [{type: eq, field: input_boolean.alarm_test_mode, value: 'off'}]}
            - afterSeconds: 2
              signal: {type: light-effect, effect: okay}
              repeat: {everySeconds: 4, times: 84, while: [{type: eq, field: input_boolean.alarm_test_mode, value: 'off'}]}
      alerts:
        - id: smoke
          title: 'SMOKE ALARM'
          message: 'Smoke alarm in the {area}'
          policy: smoke-leak
          rule:
            type: state
            entities:
              - binary_sensor.smoke_detector_kitchen_smoke
              - binary_sensor.smoke_detector_mechanical_room_smoke
              - binary_sensor.smoke_detector_master_wardrobe_smoke
              - binary_sensor.smoke_detector_hallway_smoke
        - id: water-leak
          title: 'WATER LEAK DETECTED'
          message: 'Water leak detected in the {area}'
          policy: smoke-leak
          rule:
            type: state
            entities:
              - binary_sensor.leak_bathtub_water_leak
              - binary_sensor.leak_laundry_room_water_leak
              - binary_sensor.leak_master_bathroom_sink_water_leak
              - binary_sensor.leak_kitchen_cabinet_water_leak
        - id: phase-loss
          title: 'Phase down'
          policy: critical
          rule:
            type: below
            topics: [dsmr/reading/phase_voltage_l1, dsmr/reading/phase_voltage_l2, dsmr/reading/phase_voltage_l3]
            threshold: 50
            unavailableIsFault: true
            forSeconds: 10
        - id: dsmr-silent
          title: 'Smart meter silent'
          policy: critical
          rule:
            type: silent
            topics: [dsmr/reading/phase_voltage_l1, dsmr/reading/phase_voltage_l2, dsmr/reading/phase_voltage_l3]
            maxSilenceSeconds: 600
